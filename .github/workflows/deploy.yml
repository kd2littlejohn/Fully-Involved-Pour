name: Deploy to Firebase Hosting

# fullyinvolvedpour.com is served by Firebase Hosting, not GitHub Pages —
# this builds web/ and deploys web/dist straight to the live site on every
# push to main, using the service account firebase init hosting:github
# created (see the FIREBASE_SERVICE_ACCOUNT_FULLY_INVOLVED_POUR repo secret).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FULLY_INVOLVED_POUR }}'
          projectId: fully-involved-pour
          channelId: live
