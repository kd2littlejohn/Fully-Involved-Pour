name: Deploy to Firebase Hosting

# fullyinvolvedpour.com is served by Firebase Hosting, not GitHub Pages —
# this builds web/ and deploys web/dist straight to the live site on every
# push to main, using the service account firebase init hosting:github
# created (see the FIREBASE_SERVICE_ACCOUNT_FULLY_INVOLVED_POUR repo secret).
#
# Release order: when a push also changes functions/, the Cloud Functions
# deploy (deploy-functions.yml: tests, approval, deploy, live smoke test,
# log check) runs first, and the website only deploys if it succeeds. A new
# web client therefore never goes live against an old backend. Pushes that
# don't touch functions/ deploy the website exactly as before.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production release at a time; a newer push waits rather than racing.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.diff.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then
            # Manual runs stay website-only, as before. Functions have their
            # own manual "Deploy Cloud Functions" workflow.
            echo "functions=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch or rewritten history: can't diff, so deploy functions to be safe.
            echo "functions=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" -- functions/ firebase.json | grep -q .; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
          fi

  web_checks:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npx tsc -b
      - name: Lint
        working-directory: web
        run: npx oxlint
      - name: Unit tests
        working-directory: web
        run: npx vitest run

  functions:
    name: Cloud Functions
    needs: [changes, web_checks]
    if: needs.changes.outputs.functions == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-functions.yml
    with:
      # All functions by default, so any backend change ships. Set the
      # FUNCTIONS_DEPLOY_TARGET repository variable (e.g.
      # "functions:askSommelier") to narrow it.
      target: ${{ vars.FUNCTIONS_DEPLOY_TARGET || 'functions' }}
    secrets: inherit

  build_and_deploy:
    needs: [changes, web_checks, functions]
    # Website deploys when checks pass and the backend deploy succeeded or
    # wasn't needed. It never deploys after a failed or cancelled backend
    # deploy.
    if: ${{ !cancelled() && needs.web_checks.result == 'success' && (needs.functions.result == 'success' || needs.functions.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FULLY_INVOLVED_POUR }}'
          projectId: fully-involved-pour
          channelId: live
