        check e_smoke_fail "${{ needs.e_smoke_fail_functions.result }}" failure "${{ needs.e_smoke_fail_build_and_deploy.result }}" skipped

        check f_logs_fail "${{ needs.f_logs_fail_functions.result }}" failure "${{ needs.f_logs_fail_build_and_deploy.result }}" skipped

        check g_no_backend "${{ needs.g_no_backend_functions.result }}" skipped "${{ needs.g_no_backend_build_and_deploy.result }}" success

        check h_gate_missing "${{ needs.h_gate_missing_functions.result }}" skipped "${{ needs.h_gate_missing_build_and_deploy.result }}" skipped

        exit $bad'
