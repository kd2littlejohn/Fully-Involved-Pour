    - g_no_backend_functions
    - g_no_backend_build_and_deploy
    - h_gate_missing_functions
    - h_gate_missing_build_and_deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
    - run: 'bad=0

        check() { if [ "$2" = "$3" ] && [ "$4" = "$5" ]; then echo "PASS $1: functions=$2 website=$4"; else echo "FAIL $1: functions=$2 (want $3) website=$4 (want $5)"; bad=1; fi; }

        check a_all_pass "${{ needs.a_all_pass_functions.result }}" success "${{ needs.a_all_pass_build_and_deploy.result }}" success

        check b_web_tests_fail "${{ needs.b_web_tests_fail_functions.result }}" skipped "${{ needs.b_web_tests_fail_build_and_deploy.result }}" skipped

