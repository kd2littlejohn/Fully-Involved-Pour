# TEMPORARY: generated simulation of deploy.yml/deploy-functions.yml job graphs. No deploys.
name: "SIM release gates"
on:
  push:
    branches:
    - claude/ecstatic-mayer-9126ud
    paths:
    - .github/workflows/sim-*.yml
permissions:
  contents: read
jobs:
  a_all_pass_changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.diff.outputs.functions }}
    steps:
    - id: diff
      run: echo "functions=true" >> "$GITHUB_OUTPUT"
  a_all_pass_web_checks:
    runs-on: ubuntu-latest
    steps:
    - run: echo "web_checks ok (simulated, no deploy)"
  a_all_pass_release_gates:
    needs:
    - a_all_pass_changes
    runs-on: ubuntu-latest
    steps:
    - run: echo "release_gates ok (simulated, no deploy)"
  a_all_pass_functions:
    needs:
    - a_all_pass_changes
    - a_all_pass_web_checks
    - a_all_pass_release_gates
    if: needs.a_all_pass_changes.outputs.functions == 'true'
    uses: ./.github/workflows/sim-functions.yml
    with:
      target: functions:askSommelier
      fail_at: none
  a_all_pass_build_and_deploy:
    needs:
    - a_all_pass_changes
    - a_all_pass_web_checks
    - a_all_pass_release_gates
    - a_all_pass_functions
    if: ${{ !cancelled() && needs.a_all_pass_web_checks.result == 'success' && needs.a_all_pass_release_gates.result == 'success' && (needs.a_all_pass_functions.result == 'success' || needs.a_all_pass_functions.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
    - run: echo "build_and_deploy ok (simulated, no deploy)"
