name: CI

# Pull-request checks. No credentials and no production access: web checks,
# plus Cloud Functions and Firestore rules tests against the local emulator.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (type check, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # jsdom 30 / undici 8 (web tests) require Node >= 22.22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx tsc -b
      - working-directory: web
        run: npx oxlint
      - working-directory: web
        run: npx vitest run
      - working-directory: web
        run: npm run build
      - name: Cloud Functions copy of the AXE Insights engine is up to date
        working-directory: web
        run: |
          npm run build:axe-engine
          git diff --exit-code -- ../functions/generated/ || {
            echo "::error::functions/generated/axeInsightsEngine.js is stale. Run 'npm run build:axe-engine' in web/ and commit the result."
            exit 1
          }

  emulator:
    name: Functions + Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm install -g firebase-tools@14.27.0
          (cd functions && npm ci)
          (cd web && npm ci)
      - name: Functions tests
        run: npm run test:functions
      - name: Firestore rules tests
        run: npm run test:rules
