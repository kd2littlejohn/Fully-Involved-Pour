# TEMPORARY: generated simulation of deploy.yml/deploy-functions.yml job graphs. No deploys.
name: "SIM functions"
on:
  workflow_call:
    inputs:
      target:
        type: string
        default: functions:askSommelier
      fail_at:
        type: string
        default: none
      smoke_test:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: simulated test
      run: if [ "${{ inputs.fail_at }}" = "test" ]; then echo "simulated failure in test"; exit 1; fi; echo ok
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - id: target
      run: echo "ask_sommelier=true" >> "$GITHUB_OUTPUT"; echo "started_at=now" >> "$GITHUB_OUTPUT"
    - name: simulated deploy
      run: if [ "${{ inputs.fail_at }}" = "deploy" ]; then echo "simulated failure in deploy"; exit 1; fi; echo ok
    outputs:
      deployed_ask_sommelier: ${{ steps.target.outputs.ask_sommelier }}
      started_at: ${{ steps.target.outputs.started_at }}
  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.deployed_ask_sommelier == 'true' && vars.AXE_SMOKE_TEST != 'false' && (github.event_name != 'workflow_dispatch' || inputs.smoke_test)
    steps:
    - name: simulated smoke-test
      run: if [ "${{ inputs.fail_at }}" = "smoke-test" ]; then echo "simulated failure in smoke-test"; exit 1; fi; echo ok
  logs:
    runs-on: ubuntu-latest
    needs:
    - deploy
    - smoke-test
    if: always() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed_ask_sommelier == 'true' && (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped')
    steps:
    - name: simulated logs
      run: if [ "${{ inputs.fail_at }}" = "logs" ]; then echo "simulated failure in logs"; exit 1; fi; echo ok
